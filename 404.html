<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Pavan Kumar Reddipalli</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #070809; color: #f5f5f3; font-family: system-ui, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 520px; padding: 40px; border: 1px solid rgba(255,255,255,.12);
        border-radius: 24px; background: rgba(255,255,255,.04); text-align: center;
      }
      .kicker { font-family: monospace; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #c8ff3d; }
      h1 { margin: 14px 0 10px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.05; }
      p { color: #a3a7ae; line-height: 1.7; }
      a { display: inline-block; margin-top: 22px; padding: 12px 20px; border-radius: 999px; background: #c8ff3d; color: #070809; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="kicker">404</div>
      <h1>That page moved.</h1>
      <p>The portfolio lives at its home address. Taking you there now.</p>
      <a href="/">Open the portfolio</a>
    </main>
    <script>window.location.replace('/' + window.location.hash);</script>
  </body>
</html>
